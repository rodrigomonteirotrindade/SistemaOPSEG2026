<!DOCTYPE html>
<html>
<head>
<title>Sistema OPSEG</title>
</head>

<body>

<h2>Sistema OPSEG</h2>

<a href="/logout">Sair</a>

{% if tipo == "admin" %}
<a href="/criar_usuario">Criar usuário</a>
{% endif %}

<a href="/grafico">Ver gráfico</a>

<h3>Cadastro</h3>

<form method="POST">
    <input type="date" name="data" required><br><br>

    <!-- CLIENTE COM SETA -->
    <select name="cliente" required>
        <option value="">Selecione</option>
        <option>Acy Andrade</option>
        <option>Atrium 3</option>
        <option>Outro</option>
    </select><br><br>

    <input type="text" name="colaborador" placeholder="Colaborador" required><br><br>

    <!-- NIVEL -->
    <select name="nivel" required>
        <option value="">Nível</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
    </select><br><br>

    <button type="submit">Salvar</button>
</form>

<h3>Registros</h3>

<table border="1">
<tr>
    <th>Data</th>
    <th>Cliente</th>
    <th>Colaborador</th>
    <th>Nível</th>
    <th>Ação</th>
</tr>

{% for r in registros %}
<tr>
    <td>{{ r["Data"] }}</td>
    <td>{{ r["Cliente"] }}</td>
    <td>{{ r["Colaborador"] }}</td>
    <td>{{ r["Nivel"] }}</td>
    <td><a href="/delete/{{ loop.index0 }}">Excluir</a></td>
</tr>
{% endfor %}

</table>

</body>
</html>
