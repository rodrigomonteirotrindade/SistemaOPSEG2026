<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {margin:0;font-family:Arial;background:#0f172a;color:white;display:flex;}
.sidebar {width:220px;background:#020617;padding:20px;height:100vh;position:fixed;}
.sidebar a {display:block;color:#cbd5f5;margin:10px 0;padding:10px;text-decoration:none;}
.main {margin-left:240px;padding:20px;width:100%;}
.cards {display:flex;gap:10px;margin-bottom:20px;}
.card {flex:1;padding:15px;border-radius:10px;text-align:center;}
.total{background:#3b82f6;} .n1{background:#22c55e;}
.n2{background:#eab308;} .n3{background:#f97316;} .n4{background:#ef4444;}
.box {background:#1e293b;padding:20px;border-radius:10px;margin-bottom:20px;}
</style>
</head>

<body>

<div class="sidebar">
<h2>OPSEG</h2>
<a href="/">Dashboard</a>
<a href="/logout">Sair</a>
</div>

<div class="main">

<h2>Dashboard</h2>

<div class="box">
<form method="GET">

<select name="operador">
<option value="todos">Todos</option>
{% for op in operadores %}
<option value="{{ op }}">{{ op }}</option>
{% endfor %}
</select>

<br><br>

<input type="date" name="data_inicio" value="{{ data_inicio }}">
<input type="date" name="data_fim" value="{{ data_fim }}">

<br><br>

<button>Filtrar</button>

</form>
</div>

<div class="cards">
<div class="card total">Total<br>{{ total }}</div>
<div class="card n1">N1<br>{{ n1 }}</div>
<div class="card n2">N2<br>{{ n2 }}</div>
<div class="card n3">N3<br>{{ n3 }}</div>
<div class="card n4">N4<br>{{ n4 }}</div>
</div>

<div class="box" style="width:350px;">
<canvas id="grafico"></canvas>
<h3>R$ {{ (n1*1.99 + n2*2.99 + n3*4.99 + n4*7.99)|round(2) }}</h3>
</div>

<div class="box">
<h3>Ranking</h3>
{% for r in ranking %}
<p>{{ r[0] }} - {{ r[1] }}</p>
{% endfor %}
</div>

<div class="box">
<form method="POST">

<input type="date" name="data" required>
<input name="titulo" placeholder="Título" required>

<select name="cliente">
{% for c in clientes %}
<option value="{{ c }}">{{ c }}</option>
{% endfor %}
</select>

<input name="colaborador" placeholder="Operador" required>

<select name="nivel">
<option value="1">N1</option>
<option value="2">N2</option>
<option value="3">N3</option>
<option value="4">N4</option>
</select>

<button>Salvar</button>

</form>
</div>

</div>

<script>
new Chart(document.getElementById("grafico"), {
type: 'doughnut',
data: {
labels: ["N1","N2","N3","N4"],
datasets: [{
data: [{{ n1 }},{{ n2 }},{{ n3 }},{{ n4 }}],
backgroundColor: ["green","yellow","orange","red"]
}]
}
});
</script>

</body>
</html>
