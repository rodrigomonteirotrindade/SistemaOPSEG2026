<div class="sidebar">
<h2>OPSEG</h2>
<a href="/">Dashboard</a>
<a href="/grafico">Gráfico</a>
<a href="/criar_usuario">Cadastrar Usuário</a>
<a href="/logout">Sair</a>
</div>

<h2>Dashboard</h2>

<div class="cards">
<div class="card">{{ total }}<br>Total</div>
<div class="card">{{ n1 }}<br>N1</div>
<div class="card">{{ n2 }}<br>N2</div>
<div class="card">{{ n3 }}<br>N3</div>
<div class="card">{{ n4 }}<br>N4</div>
</div>

<form method="POST">
<input type="date" name="data" required>

<select name="cliente">
<option>Acy Andrade</option>
<option>Atrium 3</option>
</select>

<input name="colaborador" placeholder="Colaborador">

<select name="nivel">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
</select>

<button>Salvar</button>
</form>

<table>
<tr>
<th>Data</th>
<th>Cliente</th>
<th>Colaborador</th>
<th>Nível</th>
<th>Ação</th>
</tr>

{% for r in registros %}
<tr>
<td>{{ r["Data"] }}</td>
<td>{{ r["Cliente"] }}</td>
<td>{{ r["Colaborador"] }}</td>
<td>{{ r["Nivel"] }}</td>
<td><a href="/delete/{{ loop.index0 }}">Excluir</a></td>
</tr>
{% endfor %}
</table>
