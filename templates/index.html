<!-- (mantive seu layout simples e funcional) -->
<h2>Dashboard</h2>

<form method="POST">
<input type="date" name="data" required>
<input name="titulo" placeholder="Título" required>
<input name="colaborador" placeholder="Operador" required>

<select name="cliente">
{% for c in clientes %}
<option value="{{ c }}">{{ c }}</option>
{% endfor %}
</select>

<select name="nivel">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
</select>

<button>Salvar</button>
</form>

<hr>

<table border="1">
<tr>
<th>Data</th>
<th>Título</th>
<th>Cliente</th>
<th>Operador</th>
<th>Nível</th>
<th>Ações</th>
</tr>

{% for r in registros %}
<tr>
<td>{{ r['data'] }}</td>
<td>{{ r['titulo'] }}</td>
<td>{{ r['cliente'] }}</td>
<td>{{ r['colaborador'] }}</td>
<td>{{ r['nivel'] }}</td>

<td>
<a href="/editar/{{ r['id'] }}">Editar</a> |
<a href="/excluir/{{ r['id'] }}">Excluir</a>
</td>
</tr>
{% endfor %}

</table>
