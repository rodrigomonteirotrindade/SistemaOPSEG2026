<form method="POST">

<input type="date" name="data" required>

<select name="cliente">
<option>Acy Andrade</option>
<option>Atrium 3</option>
</select>

<input name="colaborador" placeholder="Colaborador" required>

<!-- 🔥 NOVO CAMPO -->
<input name="titulo" placeholder="Título do trabalho" required>

<select name="nivel">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
</select>

<button>Salvar</button>
</form>

<table>
<tr>
<th>Data</th>
<th>Cliente</th>
<th>Colaborador</th>
<th>Título</th>
<th>Nível</th>
<th>Ação</th>
</tr>

{% for r in registros %}
<tr>
<td>{{ r["Data"] }}</td>
<td>{{ r["Cliente"] }}</td>
<td>{{ r["Colaborador"] }}</td>
<td>{{ r["Titulo"] }}</td>
<td>{{ r["Nivel"] }}</td>
<td><a href="/delete/{{ loop.index0 }}">Excluir</a></td>
</tr>
{% endfor %}
</table>
