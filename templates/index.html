<!DOCTYPE html>
<html>
<head>
    <title>Sistema OPSEG</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
            padding: 20px;
        }

        h2 {
            color: #333;
        }

        form {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 95%;
            padding: 8px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th {
            background: #007BFF;
            color: white;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout {
            text-decoration: none;
            background: red;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
        }

        .delete {
            background: red;
            color: white;
            padding: 5px 8px;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<div class="topo">
    <h2>Sistema OPSEG</h2>
    <a href="/logout" class="logout">Sair</a>
</div>

<h3>Cadastro</h3>

<form method="POST">
    <input type="date" name="data" required>
    <input type="text" name="cliente" placeholder="Cliente" required>
    <input type="text" name="colaborador" placeholder="Colaborador" required>
    <button type="submit">Salvar</button>
</form>

<h3>Registros</h3>

<table>
    <tr>
        <th>#</th>
        <th>Data</th>
        <th>Cliente</th>
        <th>Colaborador</th>
        <th>Ação</th>
    </tr>

    {% for r in registros %}
    <tr>
        <td>{{ loop.index0 }}</td>
        <td>{{ r.Data }}</td>
        <td>{{ r.Cliente }}</td>
        <td>{{ r.Colaborador }}</td>
        <td>
            <a href="/delete/{{ loop.index0 }}" class="delete">Excluir</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
