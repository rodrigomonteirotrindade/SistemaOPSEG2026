<!DOCTYPE html>
<html>
<head>
    <title>Sistema OPSEG</title>
</head>
<body>

<h2>Cadastro</h2>

<form method="POST">
    <input type="date" name="data" required><br><br>
    <input type="text" name="cliente" placeholder="Cliente" required><br><br>
    <input type="text" name="colaborador" placeholder="Colaborador" required><br><br>
    <button type="submit">Salvar</button>
</form>

<hr>

<h2>Registros</h2>

<table border="1">
<tr>
    <th>Data</th>
    <th>Cliente</th>
    <th>Colaborador</th>
</tr>

{% for r in registros %}
<tr>
    <td>{{ r.Data }}</td>
    <td>{{ r.Cliente }}</td>
    <td>{{ r.Colaborador }}</td>
</tr>
{% endfor %}

</table>

<br>
<a href="/logout">Sair</a>

</body>
</html>
