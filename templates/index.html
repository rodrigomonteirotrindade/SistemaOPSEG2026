<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
</head>

<body style="font-family:Arial;background:#f1f5f9;">

<!-- MENU -->
<div style="background:#0f172a;padding:10px;">
    <a href="/" style="color:white;">Dashboard</a>
    <a href="/grafico" style="color:white;margin-left:15px;">Gráficos</a>
    <a href="/usuarios" style="color:white;margin-left:15px;">Usuários</a>
    <a href="/clientes" style="color:white;margin-left:15px;">Clientes</a>
    <a href="/logout" style="color:red;margin-left:15px;">Sair</a>
</div>

<h2>Dashboard</h2>

<p>Total: {{ total }} | N1: {{ n1 }} | N2: {{ n2 }} | N3: {{ n3 }} | N4: {{ n4 }}</p>

<form method="POST">

<input type="date" name="data" required>

<input name="titulo" placeholder="Título" required>

<select name="cliente">
{% for c in clientes %}
<option>{{ c }}</option>
{% endfor %}
</select>

<input name="colaborador" placeholder="Colaborador" required>

<select name="nivel">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
</select>

<button>Salvar</button>

</form>

<table border="1">
<tr>
<th>ID</th>
<th>Data</th>
<th>Título</th>
<th>Cliente</th>
<th>Colaborador</th>
<th>Nível</th>
<th>Ação</th>
</tr>

{% for r in registros %}
<tr>
<td>{{ r[0] }}</td>
<td>{{ r[1] }}</td>
<td>{{ r[2] }}</td>
<td>{{ r[3] }}</td>
<td>{{ r[4] }}</td>
<td>
<form action="/editar/{{ r[0] }}" method="POST">
<select name="nivel">
<option {% if r[5]=='1' %}selected{% endif %}>1</option>
<option {% if r[5]=='2' %}selected{% endif %}>2</option>
<option {% if r[5]=='3' %}selected{% endif %}>3</option>
<option {% if r[5]=='4' %}selected{% endif %}>4</option>
</select>
<button>Alterar</button>
</form>
</td>

<td><a href="/delete/{{ r[0] }}">Excluir</a></td>
</tr>
{% endfor %}

</table>

</body>
</html>
