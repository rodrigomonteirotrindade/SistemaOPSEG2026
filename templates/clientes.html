<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clientes</title>
</head>

<body>

<h2>Clientes</h2>

<form method="POST">
<input name="nome" placeholder="Nome do cliente" required>
<button>Adicionar</button>
</form>

<br>

<table border="1">
<tr>
<th>Nome</th>
</tr>

{% for c in clientes %}
<tr>
<td>{{ c['nome'] }}</td>
</tr>
{% endfor %}

</table>

<br>
<a href="/">Voltar</a>

</body>
</html>
