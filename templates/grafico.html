<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gráfico</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; background:#f1f5f9; padding:20px; }
.card { background:#fff; padding:20px; border-radius:10px; width:350px; }
</style>
</head>

<body>

<h2>Dashboard</h2>

{% if is_admin %}
<form method="GET">
<select name="operador" onchange="this.form.submit()">
<option value="">Todos</option>
{% for op in operadores %}
<option value="{{op}}" {% if op == operador_selecionado %}selected{% endif %}>
{{op}}
</option>
{% endfor %}
</select>
</form>
{% endif %}

<br>

<div class="card">
<canvas id="grafico"></canvas>
</div>

<script>
new Chart(document.getElementById("grafico"), {
type: 'pie',
data: {
labels: ["N1","N2","N3","N4"],
datasets: [{
data: [{{n1}},{{n2}},{{n3}},{{n4}}],
backgroundColor:["green","yellow","orange","red"]
}]
}
});
</script>

<br>

<h3>Valores:</h3>
<p>N1: {{n1}} → R$ {{v1}}</p>
<p>N2: {{n2}} → R$ {{v2}}</p>
<p>N3: {{n3}} → R$ {{v3}}</p>
<p>N4: {{n4}} → R$ {{v4}}</p>

<hr>

<h2>Total: R$ {{ total }}</h2>

<br>
<a href="/">⬅ Voltar</a>

</body>
</html>
