<!DOCTYPE html>
<html>
<head>
<title>Gráfico</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h2>Gráfico</h2>

<div style="width:300px;">
<canvas id="grafico"></canvas>
</div>

<h3>Total: R$ {{ total_valor }}</h3>

<script>
new Chart(document.getElementById("grafico"), {
type: 'pie',
data: {
labels: ["N1","N2","N3","N4"],
datasets: [{
data: {{ dados }},
backgroundColor: ["green","yellow","orange","red"]
}]
},
options: {
plugins: {
tooltip: {
callbacks: {
label: function(context) {
let valores = {{ valores }};
let i = context.dataIndex;
return context.label + ": R$ " + valores[i];
}
}
}
}
}
});
</script>

</body>
</html>
