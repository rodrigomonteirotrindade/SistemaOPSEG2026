<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gráfico</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; background:#f1f5f9; padding:20px; }
.card { background:#fff; padding:20px; border-radius:10px; width:400px; }
</style>

</head>

<body>

<h2>Gráfico - {{ usuario }}</h2>

<div class="card">
<canvas id="grafico"></canvas>
</div>

<script>
new Chart(document.getElementById("grafico"), {
type: 'pie',
data: {
labels: ["N1","N2","N3","N4"],
datasets: [{
data: [{{n1}},{{n2}},{{n3}},{{n4}}],
backgroundColor:["green","yellow","orange","red"]
}]
}
});
</script>

<br>

<h3>Total: R$ {{ total }}</h3>

<br>
<a href="/">⬅ Voltar</a>

</body>
</html>
