<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    font-family:Arial;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box {
    background:white;
    padding:30px;
    border-radius:10px;
    width:300px;
    text-align:center;
}

input {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    padding:10px;
    width:100%;
    background:#2563eb;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="box">
<h2>Login OPSEG</h2>

<form method="POST">
<input name="username" placeholder="Usuário" required>
<input type="password" name="password" placeholder="Senha" required>
<button>Entrar</button>
</form>

</div>

</body>
</html>
