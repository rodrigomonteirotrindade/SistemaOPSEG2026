<!DOCTYPE html>
<html>

<head>

<title>Usuários</title>

<style>

body{
font-family:Segoe UI;
background:#eef2f7;
padding:40px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
margin-bottom:25px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:14px;
text-align:center;
}

thead{
background:#111827;
color:white;
}

button{
background:#2563eb;
color:white;
border:none;
padding:9px 15px;
border-radius:7px;
cursor:pointer;
}

input,select{
padding:10px;
border:1px solid #ccc;
border-radius:7px;
}

</style>

</head>

<body>

<h1>Usuários</h1>

<div class="card">

<h3>Criar Usuário</h3>

<form method="POST">

<input
name="username"
placeholder="Usuário"
required>

<input
name="password"
placeholder="Senha"
required>

<select name="tipo">

<option value="operador">
Operador
</option>

<option value="admin">
Admin
</option>

</select>

<button>
Criar
</button>

</form>

</div>

<div class="card">

<h3>Usuários cadastrados</h3>

<table>

<thead>

<tr>
<th>Usuário</th>
<th>Tipo</th>
<th>Nova senha</th>
<th>Ação</th>
</tr>

</thead>

<tbody>

{% for u in usuarios %}

<tr>

<td>{{u['username']}}</td>

<td>{{u['tipo']}}</td>

<td>

<form
method="POST"
action="/alterar_senha/{{u['username']}}">

<input
name="nova_senha"
placeholder="Nova senha"
required>

</td>

<td>

<button>
Alterar
</button>

</form>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
