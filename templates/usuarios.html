<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Usuários</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
    border-radius:12px;
}

.navbar-brand{
    font-weight:bold;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container-fluid">

<a class="navbar-brand" href="/">
OPSEG
</a>

<div>

<a class="btn btn-outline-light btn-sm" href="/">
Painel
</a>

<a class="btn btn-danger btn-sm" href="/logout">
Sair
</a>

</div>

</div>

</nav>

<div class="container mt-4">

<h2 class="mb-4">
Gerenciamento de Usuários
</h2>

<div class="card shadow-sm mb-4">

<div class="card-header">
Novo Usuário
</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-4">

<label>Usuário</label>

<input
name="username"
class="form-control"
required>

</div>

<div class="col-md-4">

<label>Senha</label>

<input
name="password"
class="form-control"
required>

</div>

<div class="col-md-2">

<label>Perfil</label>

<select
name="tipo"
class="form-control">

<option value="admin">
Administrador
</option>

<option value="operador">
Operador
</option>

</select>

</div>

<div class="col-md-2 d-flex align-items-end">

<button class="btn btn-success w-100">
Cadastrar
</button>

</div>

</div>

</form>

</div>

</div>

<div class="card shadow-sm">

<div class="card-header">
Usuários Cadastrados
</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-striped table-hover">

<thead>

<tr>

<th>Usuário</th>
<th>Perfil</th>
<th>Ações</th>

</tr>

</thead>

<tbody>

{% for u in usuarios %}

<tr>

<td>
{{ u['username'] }}
</td>

<td>

{% if u['tipo'] == 'admin' %}
<span class="badge bg-danger">
Administrador
</span>
{% else %}
<span class="badge bg-primary">
Operador
</span>
{% endif %}

</td>

<td>

<a
href="#"
class="btn btn-warning btn-sm">

Editar

</a>

<a
href="#"
class="btn btn-danger btn-sm"
onclick="return confirm('Deseja excluir este usuário?')">

Excluir

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</div>

</body>
</html>
