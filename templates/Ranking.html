<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Ranking - OPSEG</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#eef2f7;
    padding:30px;
}

h1{
    color:#111827;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    margin-bottom:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#111827;
    color:white;
}

th,td{
    padding:14px;
    text-align:center;
}

tbody tr:nth-child(even){
    background:#f8fafc;
}

tbody tr:hover{
    background:#e0f2fe;
}

.posicao{
    font-weight:bold;
    font-size:18px;
}

.voltar{
    display:inline-block;
    margin-top:20px;
    background:#111827;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
}

.voltar:hover{
    background:#1f2937;
}
</style>
</head>

<body>

<h1>🏆 Ranking de Operadores</h1>

<div class="card">

<table>

<thead>
<tr>
    <th>Posição</th>
    <th>Operador</th>
    <th>Total de Registros</th>
</tr>
</thead>

<tbody>

{% for r in ranking %}

<tr>
    <td class="posicao">
        {{ loop.index }}º
    </td>

    <td>
        {{ r['colaborador'] }}
    </td>

    <td>
        {{ r['total'] }}
    </td>
</tr>

{% else %}

<tr>
    <td colspan="3">
        Nenhum registro encontrado.
    </td>
</tr>

{% endfor %}

</tbody>

</table>

</div>

<a href="/" class="voltar">
⬅ Voltar ao Dashboard
</a>

</body>
</html>
