<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ranking</title>

<style>
body{
    font-family:Segoe UI;
    background:#eef2f7;
    padding:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:14px;
    text-align:center;
}

thead{
    background:#111827;
    color:white;
}

h1{
    margin-bottom:20px;
}

.voltar{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:10px 15px;
    border-radius:8px;
}
</style>
</head>

<body>

<h1>🏆 Ranking de Operadores</h1>

<div class="card">

<table>

<thead>
<tr>
<th>Posição</th>
<th>Operador</th>
<th>Total de Registros</th>
</tr>
</thead>

<tbody>

{% for r in ranking %}

<tr>
<td>{{ loop.index }}</td>
<td>{{ r['colaborador'] }}</td>
<td>{{ r['total'] }}</td>
</tr>

{% endfor %}

</tbody>

</table>

</div>

<a href="/" class="voltar">
⬅ Voltar
</a>

</body>
</html>
