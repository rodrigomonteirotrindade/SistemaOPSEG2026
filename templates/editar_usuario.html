<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Editar Usuário - OPSEG</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#eef2f7;
    padding:30px;
}

h1{
    color:#111827;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    max-width:500px;
}

label{
    font-weight:bold;
    color:#111827;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-top:8px;
    margin-bottom:20px;
}

button{
    background:#16a34a;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#15803d;
}

.voltar{
    display:inline-block;
    margin-top:20px;
    background:#111827;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
}

.voltar:hover{
    background:#1f2937;
}
</style>
</head>

<body>

<h1>✏️ Editar Usuário</h1>

<div class="card">

<form method="POST">

    <label>Usuário</label>
    <input
        type="text"
        value="{{ usuario['username'] }}"
        disabled
    >

    <label>Nova Senha</label>
    <input
        type="password"
        name="password"
        placeholder="Digite uma nova senha"
    >

    <label>Tipo de Usuário</label>
    <select name="tipo" required>
        <option value="operador" {% if usuario['tipo'] == 'operador' %}selected{% endif %}>
            Operador
        </option>

        <option value="admin" {% if usuario['tipo'] == 'admin' %}selected{% endif %}>
            Administrador
        </option>
    </select>

    <button type="submit">
        Salvar Alterações
    </button>

</form>

</div>

<a href="/usuarios" class="voltar">
⬅ Voltar para Usuários
</a>

</body>
</html>
