```html
<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<title>Histórico - OPSEG</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#eef2f7;
    padding:30px;
}

h1{
    color:#111827;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    margin-bottom:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#111827;
    color:white;
}

th,td{
    padding:14px;
    text-align:center;
}

tbody tr:nth-child(even){
    background:#f8fafc;
}

tbody tr:hover{
    background:#e0f2fe;
}

.btn-limpar{
    background:#dc2626;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
}

.btn-limpar:hover{
    background:#b91c1c;
}

.voltar{
    display:inline-block;
    margin-top:20px;
    background:#111827;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
}

.voltar:hover{
    background:#1f2937;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

</style>

</head>

<body>

<div class="topo">

<h1>📜 Histórico do Sistema</h1>

<a
href="/limpar_historico"
class="btn-limpar"
onclick="return confirm('Deseja apagar todo o histórico?')">
Limpar Histórico
</a>

</div>

<div class="card">

<table>

<thead>

<tr>
    <th>ID</th>
    <th>Usuário</th>
    <th>Ação</th>
    <th>Data/Hora</th>
</tr>

</thead>

<tbody>

{% for h in historico %}

<tr>

<td>{{h['id']}}</td>

<td>{{h['usuario']}}</td>

<td>{{h['acao']}}</td>

<td>{{h['data_hora']}}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<a href="/" class="voltar">
⬅ Voltar ao Dashboard
</a>

</body>
</html>
```
